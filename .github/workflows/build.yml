name: Build

on:
  # Every branch, so that work on a branch fails here before it is merged rather than at its release (AX-4.4).
  push:
    branches: ['**']
  pull_request:

# Read only: a build never writes to the repository (the security audit of 2026-10-24 S-33).
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SDK band is global.json's, the one place it is set (docs/axKit/longevity.md).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: The quick checks
        # The one list of the quick checks, the same that test.ps1 and the push check run on the development computer
        # (tools/pages.ps1 -Check; docs/axKit/repairs.json R-81): every failure is named in one run, and a check that
        # joins the list is run here without an edit. Until 2026-11-27 each check was a step of its own, and the two
        # the list had gained since, the map and the bounds of the workflow graph, were not run here at all.
        # What it runs, each writing nothing; every one runs on this runner (two build the runner of the automated
        # checks, tools/AxAutomate, which plays nothing here and opens no window):
        #   ./tools/outside-calls.ps1 -Check  every network request, program start and pipe in src has its explanation,
        #                                     and docs/axKit/outside-calls.md is what the sources give (SPEC.md B-17)
        #   ./tools/workflows.ps1 -Check      every script has its workflow label, and the workflow pages are what the
        #                                     scripts and the command inventory give (AU-5.2a)
        #   ./tools/repairs.ps1 -Check        the repair list's fields hold, and repairs.md is what repairs.json gives
        #   ./tools/apps-page.ps1 -Check      apps.md is what Dispatch.Apps and the folders give (repairs R-44)
        #   ./tools/cases.ps1 -Check          cases.md is what cases.json gives (AX-5.10)
        #   ./tools/key-map.ps1 -Check        key-map.md is what the inventory, BundleKeys and the key families give
        #   ./tools/families.ps1 -Check       families.md is what families.json gives, and that file names every
        #                                     sound, every file that plays one, every menu and every family of keys
        #   ./tools/owed.ps1 -Check           owed.md is what the cases, the repairs and the NVDA record's Owed give
        #   ./tools/components.ps1 -Check     components.md is what components.json gives (framework.md FW-7.3)
        #   ./tools/map.ps1 -Check            map.md is what workflow-graph.json gives
        #   ./tools/graph-check.ps1 -Check    the bounds of the workflow graph: over-the-bounds.md and goal-counts.json
        #                                     are what the scripts give, and no goal is longer than its baseline
        #   ./tools/guide-menus.ps1 -Check    each guide's Menus section is what the command inventory gives
        #   ./tools/doc-menus.ps1 -Check      every menu path a document names is one the windows have
        #   ./tools/upstream.ps1 -Check       upstream.json is well formed; the installed versions are never compared
        #                                     here, this computer has its own (automation.md)
        #   ./tools/script-lint.ps1 -Check    every .ps1 is ASCII, parses, has no local named like a parameter, and
        #                                     no culture's sort in a page script
        run: ./tools/pages.ps1 -Check
      - name: Build and test
        # ContinuousIntegrationBuild: deterministic paths; the test packages restore exactly as their lock files say (S-34).
        run: dotnet test AxKit.sln --configuration Release --nologo -p:ContinuousIntegrationBuild=true
      - name: Build the Store package
        # The MSIX package of the Microsoft Store (docs/axKit/SPEC.md AX-13): the manifest from the apps listing must
        # pass makeappx's schema check on every push, not first at a release. The runner has the Windows SDK.
        run: ./publish.ps1 -Msix
