name: Build

on:
  # Every branch, so that work on a branch fails here before it is merged rather than at its release (AX-4.4).
  push:
    branches: ['**']
  pull_request:

# Read only: a build never writes to the repository (docs/axKit/security-audit-2026-10-24.md S-33).
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SDK band is global.json's, the one place it is set (docs/axKit/longevity.md).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Outside calls are listed
        # Every network request, program start and pipe in src carries its explanation, and docs/axKit/outside-calls.md
        # is what the sources give (docs/axKit/SPEC.md B-17).
        run: ./tools/outside-calls.ps1 -Check
      - name: Workflows are listed
        # Every automated script has its workflow label, and docs/axKit/workflows.md is what the scripts give (AU-5.2a).
        run: ./tools/workflows.ps1 -Check
      - name: Repairs are listed
        # The repair list's fields hold, and docs/axKit/repairs.md is what docs/axKit/repairs.json gives.
        run: ./tools/repairs.ps1 -Check
      - name: Apps are listed
        # docs/axKit/apps.md is what Dispatch.Apps and the folders give: the one list of the apps (repairs R-44).
        run: ./tools/apps-page.ps1 -Check
      - name: Build and test
        # ContinuousIntegrationBuild: deterministic paths; the test packages restore exactly as their lock files say (S-34).
        run: dotnet test AxKit.sln --configuration Release --nologo -p:ContinuousIntegrationBuild=true
      - name: Build the Store package
        # The MSIX package of the Microsoft Store (docs/axKit/SPEC.md AX-13): the manifest from the apps listing must
        # pass makeappx's schema check on every push, not first at a release. The runner has the Windows SDK.
        run: ./publish.ps1 -Msix
