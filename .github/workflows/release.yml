# Builds the zip that publish.ps1 builds locally and attaches it to a draft GitHub release, with install.cmd on its own
# so it can be downloaded alone and install the latest release. Three jobs: build tests with a token that can only
# read; sign publishes the folder with the reporter token of the reports (docs/axkit/reports.md RP-6.2), has AxKit.exe
# signed for Windows through Microsoft's Azure Artifact Signing, by an identity that can sign and do nothing else
# (docs/axkit/code-signing.md), and then makes the zip; draft uploads and attests. The
# release stays a draft: release.ps1, on the maintainer's machine, signs the zip with the release key, which never
# reaches GitHub, uploads the signature and publishes the release (docs/axkit/SPEC.md AX-3.4;
# docs/axkit/security-audit-2026-10-24.md S-27, S-30, S-31). The apps install only a signed zip. Started by pushing a
# version tag, which release.ps1 does, or by hand from the Actions tab (or `gh workflow run release.yml -f tag=v1.0.1`)
# for a tag that already exists.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release, for example v1.0.1'
        required: true

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # Tests with a token that can only read: the test code and its packages never hold one that writes, and never see
  # the signing identity's ids or the reporter token (S-30); the sign job, the "release" environment, publishes.
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      # The SDK band is global.json's, the one place it is set (docs/axkit/longevity.md).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Check the tag against the project version
        shell: pwsh
        env:
          # Passed through the environment and checked, never pasted into the script (S-32).
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          $tag = $env:TAG_INPUT
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Host "The tag must be v and three numbers, like v1.0.1."
            exit 1
          }
          $version = $tag.Substring(1)
          $projectVersion = (Select-Xml -Path src/AxKit/AxKit.csproj -XPath '/Project/PropertyGroup/Version').Node.InnerText
          if ($projectVersion -ne $version) {
            Write-Host "Tag $tag does not match <Version>$projectVersion</Version> in AxKit.csproj. Release with release.ps1, which sets both."
            exit 1
          }
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test AxKit.sln --configuration Release --nologo -p:ContinuousIntegrationBuild=true

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          .\tools\release-notes.ps1 -Version $env:VERSION | Set-Content -Path notes.md -Encoding utf8
          # The SDK that built this release, so that a rebuild years later knows what to reproduce (docs/axkit/longevity.md).
          Add-Content -Path notes.md -Value "`nBuilt with the .NET SDK $(dotnet --version)." -Encoding utf8
          # The terms of this release, which installing it accepts (AX-11.7): the update notice shows these notes.
          Add-Content -Path notes.md -Value "`naxKit is a set of personal tools shared as they are, not a product or a service. Installing this release means accepting its licence, https://github.com/KyleKeane/AxKit/blob/$env:TAG/LICENSE, and the reminders in NOTICE.md, https://github.com/KyleKeane/AxKit/blob/$env:TAG/NOTICE.md." -Encoding utf8
          # Every release page links the code signing policy, the privacy page and the governance (docs/axkit/code-signing.md).
          Add-Content -Path notes.md -Value "`nCode signing policy, privacy and governance: https://github.com/KyleKeane/AxKit#code-signing-policy, https://github.com/KyleKeane/AxKit/blob/main/PRIVACY.md and https://github.com/KyleKeane/AxKit/blob/main/GOVERNANCE.md" -Encoding utf8
          "$env:TAG" | Set-Content -Path tag.txt -Encoding ascii

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            install.cmd
            notes.md
            tag.txt
          if-no-files-found: error

  # Publishes the folder, signs AxKit.exe for Windows and makes the zip. The job signs in to Azure with the run's own OpenID Connect token
  # (azure/login, no stored secret): GitHub issues that token only to runs of the "release" environment (main and v*
  # tags), and Azure exchanges it only for the identity whose federated credential names this repository and that
  # environment. The identity holds one role, Artifact Signing Certificate Profile Signer, on the signing account alone,
  # so a run can sign and nothing else (docs/axkit/code-signing.md section 1). The ids azure/login takes are the
  # environment's secrets: the build job, which runs the tests and their packages, never sees them (S-30). The
  # repository variable AZURE_CERTIFICATE_PROFILE names the certificate profile and is the switch: unset, the two
  # signing steps are skipped and the release notes say the program is unsigned; set, nothing is zipped unless Windows
  # finds the signature valid.
  sign:
    needs: build
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
      # The OpenID Connect token azure/login exchanges for the signing identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The notes, the tag and install.cmd from the build job, whose tests passed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build

      # The folder only, zipped below once AxKit.exe is signed. The reporter token of the reports (docs/axkit/reports.md
      # RP-6.2) goes into the build from the "release" environment's secret, so that only this job, which runs no test
      # package, ever holds it; without the secret the build cannot send reports and its notice says so.
      - name: Publish
        shell: pwsh
        env:
          AXKIT_REPORTER_TOKEN: ${{ secrets.AXKIT_REPORTER_TOKEN }}
        run: .\publish.ps1 -NoInstall -NoZip

      - name: Sign in to Azure as the signing identity
        if: vars.AZURE_CERTIFICATE_PROFILE != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Microsoft issues a certificate in the maintainer's verified name for this signing, from its own certificate
      # authority, and signs in its cloud; the key never exists outside it. The signature is timestamped, since the
      # certificate itself lives only days.
      - name: Sign AxKit.exe with Azure Artifact Signing
        if: vars.AZURE_CERTIFICATE_PROFILE != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: axkit-code-signing
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\publish\win-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Nothing is zipped unless Windows itself finds the signature valid (ReleaseWorkflowTests keeps this order); with
      # signing off, the notes say so, so that no release pretends otherwise.
      - name: Check the signature, then make the zip
        shell: pwsh
        env:
          SIGNING: ${{ vars.AZURE_CERTIFICATE_PROFILE != '' }}
        run: |
          $signature = Get-AuthenticodeSignature publish\win-x64\AxKit.exe
          if ($env:SIGNING -eq 'true') {
            if ($signature.Status -ne 'Valid') {
              Write-Host "AxKit.exe is not validly signed: $($signature.Status), $($signature.StatusMessage). No zip was made."
              exit 1
            }
            Write-Host "AxKit.exe is signed by $($signature.SignerCertificate.Subject), timestamped by $($signature.TimeStamperCertificate.Subject)."
            # The release page and the update notice say who signed the program, by the name Windows shows as its publisher.
            $signer = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            Add-Content -Path notes.md -Value "`nAxKit.exe in this release is signed for Windows by $signer, through Microsoft's Azure Artifact Signing; Windows shows that name as the publisher (https://github.com/KyleKeane/AxKit/blob/main/docs/axkit/code-signing.md)." -Encoding utf8
          } else {
            Write-Host "AZURE_CERTIFICATE_PROFILE is not set: AxKit.exe goes out unsigned (signature status $($signature.Status))."
            Add-Content -Path notes.md -Value "`nAxKit.exe in this release carries no Windows signature, and Windows' Smart App Control may refuse it; signed releases are being set up (https://github.com/KyleKeane/AxKit/blob/main/docs/axkit/code-signing.md)." -Encoding utf8
          }
          .\publish.ps1 -ZipOnly

      # The MSIX package for the Microsoft Store (docs/axkit/SPEC.md AX-13), unsigned, since the Store signs it after
      # certification: attached to the release for the maintainer's upload to Partner Center (docs/axkit/store-distribution.md
      # phase 6). Built after the zip so that neither build touches the other's folder; the same reporter token goes in.
      - name: Build the Store package
        shell: pwsh
        env:
          AXKIT_REPORTER_TOKEN: ${{ secrets.AXKIT_REPORTER_TOKEN }}
        run: .\publish.ps1 -Msix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            publish/AxKit-*-win-x64.zip
            publish/AxKit-*.msix
            install.cmd
            notes.md
            tag.txt
          if-no-files-found: error

  # Uploads what the sign job made to a draft release, and attests where it was built; runs no code of the repository.
  draft:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # Provenance: gh attestation verify <zip or msix> --repo KyleKeane/AxKit tells this workflow built it (S-31).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            publish/AxKit-*-win-x64.zip
            publish/AxKit-*.msix

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # tag.txt comes from Windows with a CRLF ending: without tr the draft was made for the tag "v3.7.0\r".
          tag=$(tr -d '\r\n' < tag.txt)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag.txt does not hold a version tag."
            exit 1
          fi
          zip=$(ls publish/AxKit-*-win-x64.zip)
          msix=$(ls publish/AxKit-*.msix)
          # A published release's files are never replaced (S-31); a draft's are, when the workflow runs again.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "Release $tag is already published; its files are not replaced."
              exit 1
            fi
            gh release upload "$tag" "$zip" "$msix" install.cmd --clobber
          else
            gh release create "$tag" "$zip" "$msix" install.cmd --title "axKit ${tag#v}" --notes-file notes.md --draft
          fi
          echo "Draft $tag is up. release.ps1 signs it and publishes it."
