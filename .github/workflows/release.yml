# Builds the zip that publish.ps1 builds locally and attaches it to a draft GitHub release, with install.cmd on its own
# so it can be downloaded alone and install the latest release. Three jobs: build tests and publishes with a token that
# can only read; sign has AxKit.exe signed for Windows by SignPath Foundation (free code signing for open-source
# projects, docs/axkit/code-signing.md), waits for the maintainer's approval of that signing, and then makes the zip;
# draft uploads and attests. The release stays a draft: release.ps1, on the maintainer's machine, signs the zip with
# the release key, which never reaches GitHub, uploads the signature and publishes the release (docs/axkit/SPEC.md
# AX-3.4; docs/axkit/security-audit-2026-10-24.md S-27, S-30, S-31). The apps install only a signed zip. Started by
# pushing a version tag, which release.ps1 does, or by hand from the Actions tab (or `gh workflow run release.yml -f
# tag=v1.0.1`) for a tag that already exists.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release, for example v1.0.1'
        required: true

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # Tests and builds with a token that can only read: the test code and its packages never hold one that writes, and
  # never see the signing token (S-30).
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      # The artifact SignPath signs; the sign job names it by this id.
      unsigned-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      # The SDK band is global.json's, the one place it is set (docs/axkit/longevity.md).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check the tag against the project version
        shell: pwsh
        env:
          # Passed through the environment and checked, never pasted into the script (S-32).
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          $tag = $env:TAG_INPUT
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Host "The tag must be v and three numbers, like v1.0.1."
            exit 1
          }
          $version = $tag.Substring(1)
          $projectVersion = (Select-Xml -Path src/AxKit/AxKit.csproj -XPath '/Project/PropertyGroup/Version').Node.InnerText
          if ($projectVersion -ne $version) {
            Write-Host "Tag $tag does not match <Version>$projectVersion</Version> in AxKit.csproj. Release with release.ps1, which sets both."
            exit 1
          }
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test AxKit.sln --configuration Release --nologo -p:ContinuousIntegrationBuild=true

      # The folder only; the sign job zips it once AxKit.exe is signed.
      - name: Publish
        shell: pwsh
        run: .\publish.ps1 -NoInstall -NoZip

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          .\tools\release-notes.ps1 -Version $env:VERSION | Set-Content -Path notes.md -Encoding utf8
          # The SDK that built this release, so that a rebuild years later knows what to reproduce (docs/axkit/longevity.md).
          Add-Content -Path notes.md -Value "`nBuilt with the .NET SDK $(dotnet --version)." -Encoding utf8
          # The terms of this release, which installing it accepts (AX-11.7): the update notice shows these notes.
          Add-Content -Path notes.md -Value "`naxKit is a set of personal tools shared as they are, not a product or a service. Installing this release means accepting its licence, https://github.com/KyleKeane/AxKit/blob/$env:TAG/LICENSE, and the reminders in NOTICE.md, https://github.com/KyleKeane/AxKit/blob/$env:TAG/NOTICE.md." -Encoding utf8
          # Every release page links the code signing policy, the privacy page and the governance, as the signing
          # service's terms ask of the download pages (docs/axkit/code-signing.md).
          Add-Content -Path notes.md -Value "`nCode signing policy, privacy and governance: https://github.com/KyleKeane/AxKit#code-signing-policy, https://github.com/KyleKeane/AxKit/blob/main/PRIVACY.md and https://github.com/KyleKeane/AxKit/blob/main/GOVERNANCE.md" -Encoding utf8
          "$env:TAG" | Set-Content -Path tag.txt -Encoding ascii

      # AxKit.exe alone, for SignPath: a GitHub artifact is a zip, so SignPath's artifact configuration is a zip with
      # AxKit.exe at its root (docs/axkit/code-signing.md section 2).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: unsigned
        with:
          name: unsigned
          path: publish/win-x64/AxKit.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            publish/win-x64/
            install.cmd
            notes.md
            tag.txt
          if-no-files-found: error

  # Has AxKit.exe signed and makes the zip. SignPath fetches the unsigned artifact from this run, checks where it was
  # built (origin verification), waits for the maintainer's approval, signs with SignPath Foundation's certificate and
  # hands the signed file back. The API token is the "release" environment's secret, so only this environment's runs
  # (main and v* tags) can submit, and the tests and their packages never run beside it (S-30).
  sign:
    needs: build
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
      # SignPath reads this run and downloads the unsigned artifact with the job's token.
      actions: read
    steps:
      # For publish.ps1 -ZipOnly; the folder comes from the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build

      - name: Have AxKit.exe signed by SignPath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: AxKit
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.unsigned-artifact-id }}
          wait-for-completion: true
          # The maintainer approves the signing by hand (the code signing policy); an hour to do so.
          wait-for-completion-timeout-in-seconds: 3600
          # The signed artifact, extracted: signed\AxKit.exe.
          output-artifact-directory: signed

      # Nothing is zipped unless Windows itself finds the signature valid (ReleaseWorkflowTests keeps this order).
      - name: Check the signature, then make the zip
        shell: pwsh
        run: |
          if (-not (Test-Path signed\AxKit.exe)) {
            Write-Host "SignPath returned no AxKit.exe. No zip was made."
            exit 1
          }
          Copy-Item signed\AxKit.exe publish\win-x64\AxKit.exe -Force
          $signature = Get-AuthenticodeSignature publish\win-x64\AxKit.exe
          if ($signature.Status -ne 'Valid') {
            Write-Host "AxKit.exe is not validly signed: $($signature.Status), $($signature.StatusMessage). No zip was made."
            exit 1
          }
          Write-Host "AxKit.exe is signed by $($signature.SignerCertificate.Subject), timestamped by $($signature.TimeStamperCertificate.Subject)."
          # The release page and the update notice say who signed the program, by the name Windows shows as its publisher.
          $signer = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          Add-Content -Path notes.md -Value "`nAxKit.exe in this release is signed for Windows by $signer; Windows shows that name as the publisher. Free code signing provided by SignPath.io, certificate by SignPath Foundation (https://github.com/KyleKeane/AxKit/blob/main/docs/axkit/code-signing.md)." -Encoding utf8
          .\publish.ps1 -ZipOnly

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            publish/AxKit-*-win-x64.zip
            install.cmd
            notes.md
            tag.txt
          if-no-files-found: error

  # Uploads what the sign job made to a draft release, and attests where it was built; runs no code of the repository.
  draft:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # Provenance: gh attestation verify <zip> --repo KyleKeane/AxKit tells this workflow built it (S-31).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'publish/AxKit-*-win-x64.zip'

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # tag.txt comes from Windows with a CRLF ending: without tr the draft was made for the tag "v3.7.0\r".
          tag=$(tr -d '\r\n' < tag.txt)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag.txt does not hold a version tag."
            exit 1
          fi
          zip=$(ls publish/AxKit-*-win-x64.zip)
          # A published release's files are never replaced (S-31); a draft's are, when the workflow runs again.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "Release $tag is already published; its files are not replaced."
              exit 1
            fi
            gh release upload "$tag" "$zip" install.cmd --clobber
          else
            gh release create "$tag" "$zip" install.cmd --title "axKit ${tag#v}" --notes-file notes.md --draft
          fi
          echo "Draft $tag is up. release.ps1 signs it and publishes it."
